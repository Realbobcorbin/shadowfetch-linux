# Shadowfetch Ember app profile: Local AI.
# Read-only in 2.1.2 - user-editable profiles are roadmap.
# App profiles are tuned presets of Ember: same engine, same automatic
# return to Balanced. While a model is generating, the idle watchdog's
# work terms (CPU EMA, GPU busy) stay above threshold by construction, so
# Ember stays hot exactly as long as the model is working.
id=local-ai
name=Local AI
blurb=Same Ember engine — the idle watchdog keeps it hot while a model is generating.
duration_seconds=0
keep_hot=yes
show_hwscan=yes
