<?xml version="1.0" encoding="UTF-8"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- org.shadowfetch.Firewatch1: the Firewatch telemetry daemon.

     Only root (the daemon, started by systemd) may own the name.
     Every local user may call it and receive its signals: the service is
     strictly read-only telemetry about the user's own machine, there is
     nothing privileged to protect behind polkit here. The smartd warning
     path does NOT go over D-Bus; it uses a root-only unix socket. -->

<busconfig>

  <policy user="root">
    <allow own="org.shadowfetch.Firewatch1"/>
    <allow send_destination="org.shadowfetch.Firewatch1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.shadowfetch.Firewatch1"
           send_interface="org.shadowfetch.Firewatch1"/>
    <allow send_destination="org.shadowfetch.Firewatch1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.shadowfetch.Firewatch1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.shadowfetch.Firewatch1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow receive_sender="org.shadowfetch.Firewatch1"/>
  </policy>

</busconfig>
