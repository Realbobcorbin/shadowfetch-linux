<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Shadowfetch Ember Mode: system bus policy for com.shadowfetch.Ember1.

  Only root (emberd, started by systemd) may own the name.  Any local
  client may read status: the interface is read-only by construction
  ({armed, hold_active, paused_units, state_file_hash} plus GetStatus),
  and its Properties.Set always refuses.  Arming and disarming never go
  through this bus name at all; they are systemd StartUnit/StopUnit,
  governed by the polkit rule in
  /usr/share/polkit-1/rules.d/50-shadowfetch-ember.rules.
-->
<busconfig>

  <policy user="root">
    <allow own="com.shadowfetch.Ember1"/>
    <allow send_destination="com.shadowfetch.Ember1"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.shadowfetch.Ember1"
           send_interface="com.shadowfetch.Ember1"/>
    <allow send_destination="com.shadowfetch.Ember1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.shadowfetch.Ember1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.shadowfetch.Ember1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

</busconfig>
