# Shadowfetch Ember Mode pause list -- curated, fixed, READ-ONLY in v1.
# (A user-editable pause list is roadmap, not this release.)
#
# Read by /usr/libexec/emberd when Ember arms.  One section per unit.
# Keys:
#   action  stop     stop the systemd unit (system scope)
#           suspend  suspend indexing (user scope; NOT handled by emberd)
#   gate    none                    always eligible
#           pkg-idle                only when no dpkg/apt lock is held AND
#                                   PackageKit reports zero transactions.
#                                   The dpkg lock check also covers
#                                   Phoenix's 80snapper pre/post window,
#                                   which only ever runs inside a dpkg
#                                   invocation.
#           no-wwan-default-route   skipped when the default route runs
#                                   over a WWAN bearer -- never take the
#                                   modem down under someone whose only
#                                   uplink it is.
#   scope   system (default) | user
#   resume  documentation of how the service comes back; emberd does not
#           parse this key.  ember-restore additionally starts every
#           'stopped' unit again on disarm.
#
# Every entry is crash-safe: stopped system services resume via D-Bus
# activation the moment anything needs them, and ember-restore starts
# them explicitly on every exit path.
#
# NEVER list here: snapperd, snapper-cleanup.timer, apt/dpkg units,
# NetworkManager, bluetooth, pipewire, cups, smartd, sddm.  Safety and
# session infrastructure is not a speed knob.

[packagekit.service]
action = stop
gate = pkg-idle
resume = bus-activation

[fwupd.service]
action = stop
gate = none
resume = bus-activation

[ModemManager.service]
action = stop
gate = no-wwan-default-route
resume = ember-restore

# baloo is user-scope file indexing: the Control Center session helper
# runs 'balooctl6 suspend' / 'balooctl6 resume' in the user session
# (including at login, when shadowfetch-ember.service is already active).
# emberd skips every scope=user entry by design -- root never reaches
# into a user session.
[baloo]
action = suspend
gate = none
scope = user
resume = session-helper
