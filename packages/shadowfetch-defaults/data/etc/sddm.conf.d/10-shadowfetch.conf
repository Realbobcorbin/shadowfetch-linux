# Shadowfetch Linux - persistent SDDM greeter config (live + installed).
# Umbra login theme, Wayland greeter, and session dir live here so they survive
# installation. Live-only autologin is in 10-shadowfetch-autologin.conf (written
# by hook 0015, removed at install time by the Calamares shellprocess module).
[Theme]
Current=umbra
CursorTheme=breeze_cursors

[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
SessionDir=/usr/share/wayland-sessions
