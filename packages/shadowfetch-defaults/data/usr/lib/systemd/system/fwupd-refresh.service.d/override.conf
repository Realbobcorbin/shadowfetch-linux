# Shadowfetch: keep a fresh install out of the systemd "degraded" state.
#
# fwupd-refresh.service runs "fwupdmgr refresh" to pull firmware metadata from the
# LVFS CDN and update the MOTD. It is timer-driven, best-effort, and OFF the boot
# critical path -- yet on a fresh first boot it can flip "systemctl is-system-running"
# to "degraded", which alarms new users even though nothing is actually wrong.
#
# Two independent reasons it can exit non-zero on first boot, each handled below:
#
#   1. Network not truly ready. NetworkManager reports "online" the moment a link
#      gets an IP -- before DNS / the LVFS CDN are reachable. The ExecStartPre waits
#      (max ~90s, off the critical path) for real name resolution + an HTTPS probe of
#      the CDN, so the refresh SUCCEEDS whenever the network is genuinely up.
#
#   2. The refresh itself returns exit 1 even WITH connectivity -- a transient CDN/LVFS
#      hiccup or server-side throttling. The stock unit already treats exit 2 and 101
#      as success (SuccessExitStatus=2 101) for exactly this "benign non-zero" reason;
#      we extend that list to include exit 1. A best-effort firmware-METADATA refresh
#      must never degrade the system -- it only feeds the MOTD and the timer retries on
#      the next fire. systemd MERGES this with the stock list -> effective "1 2 101".
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 30 ]; do getent hosts cdn.fwupd.org >/dev/null 2>&1 && break; i=$((i+1)); sleep 3; done; j=0; while [ $j -lt 20 ]; do curl -sS -m 5 -o /dev/null https://cdn.fwupd.org/ 2>/dev/null && exit 0; j=$((j+1)); sleep 3; done; exit 0'
SuccessExitStatus=1
