# Shadowfetch Fireproof: apt-listchanges must never block a live run.
#
# Fireproof shows NEWS itself, with a Proceed/Stop gate, over the debs it
# just downloaded (apt-listchanges --which=news -f text). The apt hook
# therefore logs instead of prompting, so a terminal `apt upgrade` and
# Fireproof's own commit both proceed without a hidden interactive pause.
[apt]
frontend=log
