<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Bus policy for the Shadowfetch Fireproof update daemon.

     Anyone may talk to the interface: Analyze is read-only by design,
     and every mutating method (Update, CancelDownload, ProceedCommit,
     AbortCommit, RecordRollback) checks polkit
     (org.shadowfetch.fireproof.update) against the caller inside the
     daemon. Only root may own the name. -->
<busconfig>
  <policy user="root">
    <allow own="org.shadowfetch.Fireproof1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.shadowfetch.Fireproof1"/>
    <allow receive_sender="org.shadowfetch.Fireproof1"/>
  </policy>
</busconfig>
