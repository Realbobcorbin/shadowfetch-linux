---
# Removes the live-session 'shadow' account from the installed system.
#
# Was a single inline command that suppressed every error and ended in `true`,
# so it could not report its own failure -- and the account it removes has a
# published password plus NOPASSWD:ALL sudo. Verified working on a real 2.0.0
# erase-disk install (2026-07-24), but three conditions could make userdel
# return 1 while the script still exited 0, silently shipping that credential.
# The logic now lives in a script that verifies its own work and fails loudly.
# See usr/local/sbin/sf-remove-live-user for the full reasoning.
#
# timeout raised 30 -> 60: the script clears target filesystem obstacles
# (chattr/sync) and verifies removal; it must not signal live-session processes.
dontChroot: false
timeout: 60
script:
  - "sh /usr/local/sbin/sf-remove-live-user"
