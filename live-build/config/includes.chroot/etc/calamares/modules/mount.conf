---
# Shadowfetch 1.8.1: Btrfs @ layout + FULL API mounts. CRITICAL: a custom mount.conf
# REPLACES the module default, so the API filesystems must be re-listed -- AND Calamares
# extraMounts only honours filesystem-type (fs:) mounts, NOT bind mounts. /dev MUST be
# devtmpfs (not a bind) or grub-install fails: "failed to get canonical path of /dev/vdaN".
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: dev
      fs: devtmpfs
      mountPoint: /dev
    - device: devpts
      fs: devpts
      mountPoint: /dev/pts
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /.snapshots
      subvolume: /@snapshots
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1, space_cache=v2 ]
