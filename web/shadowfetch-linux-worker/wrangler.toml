name = "shadowfetch-linux"
main = "src/index.js"
compatibility_date = "2026-05-18"

# This worker is private infrastructure reached through the main website's
# LINUX service binding. The edge router delegates only release artifacts,
# APT files, download streams, signatures, and publish endpoints. Human-facing
# /linux pages stay with the Astro site so page routes cannot shadow each other.
workers_dev = false
preview_urls = false

# R2 bucket holding ISO releases (releases/*.iso, releases/*.sha256, releases/*.asc)
# and the APT repo files (apt/dists/*, apt/pool/*) and the GPG pubkey
# (shadowfetch.gpg.asc).
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "shadowfetch-linux"

[observability]
enabled = true
